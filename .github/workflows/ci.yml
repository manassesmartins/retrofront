name: CI

# Validação contínua: análise estática, testes e build dos artefatos
# (APK Android + bundle Linux) a cada push na main e em pull requests.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build APK e bundle Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: retrofront-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Instalar dependências do GTK (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Build Linux (release)
        run: flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: retrofront-linux
          path: build/linux/x64/release/bundle/**
