name: Release

# Auto-versionamento e releases:
#  - A cada commit/push na main, gera automaticamente uma pré-release
#    (Beta) com o APK, ex.: v1.0.42-beta.
#  - Releases estáveis (ex.: v1.1.0) só são criadas manualmente via
#    "Run workflow" informando a versão desejada.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stable_version:
        description: 'Versão estável (ex.: 1.1.0). Vazio = pré-lançamento automático.'
        required: false
        default: ''

jobs:
  release:
    name: Build e release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Calcular versão
        id: version
        run: |
          STABLE="${{ github.event.inputs.stable_version }}"
          COMMITS=$(git rev-list --count HEAD)

          if [ -n "$STABLE" ]; then
            # Release estável solicitada manualmente.
            echo "version_name=$STABLE"            >> "$GITHUB_OUTPUT"
            echo "version_code=$COMMITS"           >> "$GITHUB_OUTPUT"
            echo "tag=v$STABLE"                    >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                >> "$GITHUB_OUTPUT"
            echo "should_release=true"             >> "$GITHUB_OUTPUT"
          else
            # A cada commit na main: pré-release Beta.
            echo "version_name=1.0.${COMMITS}-beta" >> "$GITHUB_OUTPUT"
            echo "version_code=$COMMITS"           >> "$GITHUB_OUTPUT"
            echo "tag=v1.0.${COMMITS}-beta"        >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                 >> "$GITHUB_OUTPUT"
            echo "should_release=true"             >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar dependências
        if: steps.version.outputs.should_release == 'true'
        run: flutter pub get

      - name: Configurar assinatura (keystore)
        if: steps.version.outputs.should_release == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::warning::Secrets de assinatura ausentes; o APK sera assinado com a chave de debug."
            exit 0
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Instalar dependências do GTK (Linux)
        if: steps.version.outputs.should_release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Build APK (release)
        if: steps.version.outputs.should_release == 'true'
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: flutter build apk --release

      - name: Build Linux (release)
        if: steps.version.outputs.should_release == 'true'
        run: |
          flutter build linux --release
          tar -C build/linux/x64/release -czf retrofront-linux.tar.gz bundle

      - name: Criar release no GitHub
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.version_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          # Não recria a release se a tag já existir (ex.: re-run do workflow).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; ignorando."
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            NOTES="Build automático (auto-versionamento). A cada commit na main uma nova pré-release Beta é gerada."
          else
            NOTES="Release estável do RetroFront."
          fi
          gh release create "$TAG" "$APK" retrofront-linux.tar.gz \
            --title "RetroFront $NAME" \
            --notes "$NOTES" \
            --prerelease="$PRERELEASE"
